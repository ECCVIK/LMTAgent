                - **T2 外部集成/可选扩展模块**：第三方适配器、外围脚本、历史兼容层或实验性特性；**只作上下文参考，未经用户与主会话明确确认不得擅自改造**。
                - **T3 无关遗留或外部范围**：与本项目无关的外部目录或第三方系统；严禁触碰。
                **穷尽标准**：`T0`/`T1` 的核心架构实现、API 与数据模型联调、单元测试与回归验证均已完成并记录结果，才算完成主干交付。
